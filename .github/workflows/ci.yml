name: CI

# Runs on the GitHub mirror only. GitLab CI stays disabled (builds_access_level=disabled):
# its pipeline mail reached the whole team. A failed run here mails only the push actor
# (the mirror token's account). Re-enabled 2026-11-20 (owner).
on:
  push:
    branches: [main, dev]
    paths-ignore: ['**/*.md', 'docs/**', 'data/input/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No `cache: pip` -- this repo has no requirements.txt or pyproject.toml
          # (dependencies live in environment.yml), and setup-python errors out
          # when the cache has nothing to key on.

      - name: Install
        run: pip install ruff

      - name: Lint (bug-level rules — blocking)
        run: ruff check --target-version py312 --select F82,F63,F7,E9 scripts

      - name: Lint (full rule set — advisory)
        run: ruff check --target-version py312 scripts
        continue-on-error: true
